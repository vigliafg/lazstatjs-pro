name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # electron-builder fetches the runtime it needs; the postinstall download in
  # `npm ci` only adds a CDN dependency that can fail the whole release.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  # GitHub's release CDN intermittently answers 504 for the Electron runtime
  # archives and their SHASUMS256 file, which kills every platform build.
  ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: linux
          - name: Windows
            os: windows-latest
            target: win
          - name: macOS
            os: macos-latest
            target: mac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging tools
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci --no-audit --no-fund

      - run: npm run build

      - name: Package
        shell: bash
        # electron-builder downloads its own tool binaries (winCodeSign, nsis,
        # appimage, fpm) from GitHub releases. That backend intermittently
        # answers 504 even while the runtime download succeeds, so fetch the
        # tools from the public mirror first and retry before giving up.
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: 'https://registry.npmmirror.com/-/binary/electron-builder-binaries/'
        run: |
          package_app() {
            if [ "${{ matrix.target }}" = "mac" ]; then
              # The macOS zip ships here; the DMG has its own job below.
              npx electron-builder --mac zip --x64 --arm64 --publish never
            else
              npx electron-builder --${{ matrix.target }} --publish never
            fi
          }
          package_app || {
            echo "packaging failed, retrying in 20s"
            sleep 20
            package_app
          } || {
            echo "packaging failed again, retrying against GitHub in 20s"
            sleep 20
            ELECTRON_BUILDER_BINARIES_MIRROR= package_app
          }

      - name: Smoke-test packaged Linux app
        if: matrix.target == 'linux'
        continue-on-error: true
        run: |
          sudo apt-get install -y xvfb
          LAZSTATS_ELECTRON_EXECUTABLE=release/linux-unpacked/lazstats xvfb-run -a npm run test:electron

      - uses: actions/upload-artifact@v4
        with:
          name: LazStats-${{ matrix.target }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.msi
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/*.blockmap
            release/latest*.yml

  dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run build

      - name: Package DMG
        shell: bash
        env:
          # The DMG is unsigned: do not let electron-builder look for a local
          # signing identity on the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_BINARIES_MIRROR: 'https://registry.npmmirror.com/-/binary/electron-builder-binaries/'
        run: |
          # hdiutil on GitHub's macOS runners intermittently fails with
          # "Device not configured"; retry the whole DMG build a few times.
          for attempt in 1 2 3; do
            if npx electron-builder --mac dmg --x64 --arm64 --publish never; then
              exit 0
            fi
            echo "DMG packaging failed (attempt $attempt/3); retrying in 20s"
            hdiutil detach /Volumes/LazStats 2>/dev/null || true
            sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: LazStats-mac-dmg
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.dmg.blockmap

  runtimes:
    name: Build CLI and MCP packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Package smoke tests
        run: |
          npm run smoke:cli:package
          npm run smoke:mcp:package

      - name: Pack runtime tarballs
        run: |
          mkdir -p artifacts/runtime
          npm run build:cli
          npm run build:mcp
          npm pack ./dist-cli --pack-destination artifacts/runtime
          npm pack ./dist-mcp --pack-destination artifacts/runtime

      - uses: actions/upload-artifact@v4
        with:
          name: LazStats-runtime
          if-no-files-found: error
          path: artifacts/runtime/*.tgz

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, dmg, runtimes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LazStats ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

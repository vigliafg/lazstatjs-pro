appId: com.lazstats.app
productName: LazStats
copyright: Copyright © 2026 vigliafg

directories:
  output: release
  buildResources: resources

icon: icon.png

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

asar: true
compression: maximum
npmRebuild: false

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

publish:
  provider: github
  owner: vigliafg
  repo: lazstatjs-pro
  releaseType: release

win:
  # Unsigned first release: allow the updater to install its own artifacts.
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

nsis:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LazStats

portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}

mac:
  category: public.app-category.education
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  category: Science
  syncDesktopName: true
  vendor: LazStats
  maintainer: vigliafg <vigliafg@gmail.com>
  synopsis: Applied statistics and reporting
  description: LazStats is a desktop application for applied statistics, data editing, charts and reproducible reports.

appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

deb:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

rpm:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
